# Profilo esteso: LiteLLM + PostgreSQL (Admin UI, virtual keys, budget, spend log).
# Avvio: docker compose -f compose.extended.yaml up -d
# Admin UI: http://localhost:4000/ui  (utente proxy_admin creato con scripts/bootstrap-admin.sh)
# Fonti: docs/Sources.md#s-020, #s-023
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}   # AZ-02: in team usa il digest (scripts/pin-images.sh)
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm-non_root:v1.108.2}   # AZ-02/AZ-03: non-root, LTS; in team usa il digest
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: .env
    environment:
      # POSTGRES_PASSWORD deve essere esadecimale: non è codificata come URI (R-codex-04, .env.example)
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-litellm}
      STORE_MODEL_IN_DB: "True"     # permette di gestire i modelli anche dall'Admin UI
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
