# LiteLLM proxy — route verso i cinque provider del talk WPC2026.
# Fonti: docs/Sources.md#s-022 (formato), #s-024..#s-027 (provider).
# model_name = alias che il client (VS Code) invia. model = <prefisso-provider>/<id-modello>.
# ⚠️ Gli ID dei modelli cambiano spesso: verifica gli ID correnti prima del talk.

model_list:
  # --- Claude.AI -> Anthropic API (docs/Sources.md#s-024, #s-040)
  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- Codex -> OpenAI API, modello raccomandato per Codex, via Responses API (docs/Decisions.md#d-015)
  - model_name: codex
    litellm_params:
      model: openai/responses/gpt-6.1-sol
      api_key: os.environ/OPENAI_API_KEY

  # --- Gemini -> Google AI Studio (prefisso gemini/; senza prefisso = Vertex AI) (docs/Decisions.md#d-016)
  # Default stabile (solo tier a pagamento)
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-4-argon
      api_key: os.environ/GEMINI_API_KEY
  # "Gemini Pro" del titolo del talk: preview
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY

  # --- OpenRouter (docs/Sources.md#s-026)
  - model_name: openrouter-gpt-oss
    litellm_params:
      model: openrouter/openai/gpt-oss-120b
      api_key: os.environ/OPENROUTER_API_KEY
      # AZ-06: provider routing di OpenRouter: niente provider che conservano i dati, niente fallback
      # ⚠️ verifica i nomi dei campi su openrouter.ai/docs (provider routing) — docs/Sources.md#s-151
      extra_body:
        provider:
          data_collection: deny
          allow_fallbacks: false
  # Reviewer antagonista: Qwen3.5 397B con fallback controllato (tool call error rate 7-14/11/2026: novita 1,85%, venice 2,02%, gmicloud 1,04%)
  - model_name: openrouter-qwen35-review
    litellm_params:
      model: openrouter/qwen/qwen3.5-397b-a17b
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          order: [novita, venice, gmicloud]
          allow_fallbacks: false
          require_parameters: true
          data_collection: deny
          ignore: [parasail, deepinfra, atlas-cloud, alibaba]

  # --- Hugging Face Inference Providers: huggingface/<provider>/<org>/<model> (docs/Sources.md#s-027, #s-047)
  # AZ-06: provider di inferenza fissato (groq), non scelto in automatico
  - model_name: hf-gpt-oss
    litellm_params:
      model: huggingface/groq/openai/gpt-oss-120b
      api_key: os.environ/HF_TOKEN

litellm_settings:
  # Scarta i parametri non supportati da un provider invece di restituire errore.
  drop_params: true
  # AZ-09: non inviare il contenuto di prompt e risposte ai callback di logging ⚠️ (verifica nella doc logging)
  turn_off_message_logging: true

general_settings:
  # Tutte le chiamate devono presentare questa chiave (o una virtual key nel profilo esteso).
  master_key: os.environ/LITELLM_MASTER_KEY
  # Hardening (docs/Decisions.md#d-018, docs/Sources.md#s-108)
  # AZ-04: blocca il login UI con UI_USERNAME/UI_PASSWORD/master key.
  # Profilo esteso: crea PRIMA un proxy_admin con scripts/bootstrap-admin.sh (l'API accetta sempre la master key).
  disable_env_credential_login: true
  # AZ-05: limiti di richiesta e upload
  max_request_size_mb: 20
  allowed_file_extensions: []      # lista vuota = nessun upload di file (la demo non ne usa)
