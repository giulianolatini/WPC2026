# Profilo minimo: solo config.yaml + master key, nessun database.
# Avvio: docker compose -f compose.minimal.yaml up -d
# Fonte: docs/Sources.md#s-020
services:
  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.108.2}   # LTS fissata, mai tag mobili (docs/Decisions.md#d-018)
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"   # solo loopback
    restart: unless-stopped
