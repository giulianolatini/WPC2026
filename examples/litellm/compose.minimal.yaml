# Profilo minimo: solo config.yaml + master key, nessun database.
# Avvio: docker compose -f compose.minimal.yaml up -d
# Fonte: docs/Sources.md#s-020
services:
  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm-non_root:v1.108.2}   # AZ-02/AZ-03: non-root, LTS; in team usa il digest
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"   # solo loopback
    restart: unless-stopped
